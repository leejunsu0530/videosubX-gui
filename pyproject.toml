[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["videosubx_gui*"]

[project]
name = "videosubX-gui"
version = "0.1.0"
authors = [
    { name = "leejunsu0530", email = "leejunsu0530@gmail.com" }
]
description = "PySide6 based gui of videosubX"
readme = "README.md"
requires-python = ">=3.11,<3.14" # paddlepaddle, whisperx 때문에 13으로 제한. 3.12 이하면 <3.13이라 적어야 3.12.1 등을 포함함
keywords = ["translate", "translation", "whisper", "whisperx", "ocr", "video", "audio", "subtitle"]
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
dependencies = [ 
    "git+https://github.com/leejunsu0530/videosubX",
    "PySide6",
]

[project.optional-dependencies]
test = ["gradio"] #일단 데모를 gradio로, 실제 구현은 pyside로


[project.scripts]
vidsubx-gui = "videosubx_gui:main"

[project.urls]
Homepage = "https://github.com/leejunsu0530/videosubX-gui"
Repository = "https://github.com/leejunsu0530/videosubX-gui"
